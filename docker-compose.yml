version: '3.8'

services:
  app:
    build:
      context: .
      target: development # Явно указываем development stage
    container_name: node_app_dev
    ports:
      - "5000:5000"
      - "9229:9229" # Для отладки
    environment:
      - NODE_ENV=development
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-mydatabase_dev}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules # Чтобы не перезаписывать node_modules из контейнера
    depends_on:
      - postgres
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres_db_dev
    environment:
      - POSTGRES_DB=${DB_NAME:-mydatabase_dev}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data_dev:

networks:
  app-network:
    driver: bridge